[build]
  base = "empresa-metodolatino/my-vite-app"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app uses client-side routing (react-router BrowserRouter), so serve
# index.html for any path that doesn't match a built file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
